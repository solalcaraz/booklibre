services:
  mongo:
    # tomamos la última imagen de mongo
    image: mongo:latest
    container_name: mongo_booklibre
    hostname: host-mongo

    # mapeo el puerto de mi computadora 27019 contra el 27017 (importante porque es el default de mongo)
    ports:
      - "27019:27017"
    volumes:
      - ~/apps/mongo_booklibre_db:/data/db
      - ~/apps/mongo_booklibre_log:/var/log/mongodb/
      - ./Docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: jacob
      MONGO_INITDB_ROOT_PASSWORD: elgordi
      MONGO_INITDB_DATABASE: booklibre_mongodb

  postgres:
    image: postgres:16
    container_name: booklibre
    environment:
      POSTGRES_DB: booklibre
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: booklibre_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "1408:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
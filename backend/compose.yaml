services:
  configsvr1:
    image: mongo:7
    container_name: booklibre_configsvr1
    command: mongod --configsvr --replSet config-rs --port 27017 --bind_ip_all
    volumes:
      - configsvr1_data:/data/db

  configsvr2:
    image: mongo:7
    container_name: booklibre_configsvr2
    command: mongod --configsvr --replSet config-rs --port 27017 --bind_ip_all
    volumes:
      - configsvr2_data:/data/db

  configsvr3:
    image: mongo:7
    container_name: booklibre_configsvr3
    command: mongod --configsvr --replSet config-rs --port 27017 --bind_ip_all
    volumes:
      - configsvr3_data:/data/db

  shard1a:
    image: mongo:7
    container_name: booklibre_shard1a
    command: mongod --shardsvr --replSet shard1-rs --port 27017 --bind_ip_all
    volumes:
      - shard1a_data:/data/db

  shard1b:
    image: mongo:7
    container_name: booklibre_shard1b
    command: mongod --shardsvr --replSet shard1-rs --port 27017 --bind_ip_all
    volumes:
      - shard1b_data:/data/db

  shard1c:
    image: mongo:7
    container_name: booklibre_shard1c
    command: mongod --shardsvr --replSet shard1-rs --port 27017 --bind_ip_all
    volumes:
      - shard1c_data:/data/db

  shard2a:
    image: mongo:7
    container_name: booklibre_shard2a
    command: mongod --shardsvr --replSet shard2-rs --port 27017 --bind_ip_all
    volumes:
      - shard2a_data:/data/db

  shard2b:
    image: mongo:7
    container_name: booklibre_shard2b
    command: mongod --shardsvr --replSet shard2-rs --port 27017 --bind_ip_all
    volumes:
      - shard2b_data:/data/db

  shard2c:
    image: mongo:7
    container_name: booklibre_shard2c
    command: mongod --shardsvr --replSet shard2-rs --port 27017 --bind_ip_all
    volumes:
      - shard2c_data:/data/db

  mongos:
    image: mongo:7
    container_name: booklibre_mongos
    command: mongos --configdb config-rs/configsvr1:27017,configsvr2:27017,configsvr3:27017 --port 27017 --bind_ip_all
    depends_on:
      - configsvr1
      - configsvr2
      - configsvr3
      - shard1a
      - shard1b
      - shard1c
      - shard2a
      - shard2b
      - shard2c
    ports:
      - "27019:27017"

  mongo-cluster-init:
    image: mongo:7
    container_name: booklibre_mongo_cluster_init
    depends_on:
      - mongos
    volumes:
      - ./Docker/mongo:/scripts:ro
    entrypoint: ["bash", "/scripts/init-sharded-cluster.sh"]

  postgres:
    image: postgres:16
    container_name: booklibre
    environment:
      POSTGRES_DB: booklibre
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: booklibre_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "1408:80"
    depends_on:
      - postgres

  redis:
    image: redis:7
    container_name: booklibre_redis
    hostname: redis
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: booklibre_redis_insight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

volumes:
  configsvr1_data:
  configsvr2_data:
  configsvr3_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data:
  postgres_data:
  redisinsight-data:
server:
  port: 9000
  error:
    whitelabel:
      enabled: false
    include-message: always

spring:
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27019/booklibre_mongodb

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway crea las tablas, Hibernate solo verifica
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    out-of-order: true
    create-schemas: false
    locations: classpath:db/migration

security:
  key: ${JWT_SECRET_KEY:booklibre-local-dev-secret-key-32-chars-minimum}
  access-token-expiration: 60000
  refresh-token-expiration: 604800000



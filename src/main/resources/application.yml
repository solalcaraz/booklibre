server:
  port: 9000
  error:
    whitelabel:
      enabled: false
    include-message: always

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/booklibre
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway crea las tablas, Hibernate solo verifica
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    out-of-order: true
    create-schemas: false
    locations: classpath:db/migration

security:
  key: ${JWT_SECRET_KEY}
  access-token-expiration: 60000
  refresh-token-expiration: 604800000


